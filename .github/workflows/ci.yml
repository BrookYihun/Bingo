# CI pipeline: runs on push to master and develop.
# Uses workflow postgres + redis services; app uses env for DB/Redis.

name: CI

on:
  push:
    branches: [master, develop]

env:
  DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-insecure-key-for-tests-only' }}
  DEBUG: "false"
  DB_NAME: postgres
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: 127.0.0.1
  DB_PORT: "5432"
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  OTP_PROVIDER_API_KEY: ${{ secrets.OTP_PROVIDER_API_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set env file for branch (master → prod.env, develop → dev.env)
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "ENV_FILE=prod.env" >> $GITHUB_ENV
          else
            echo "ENV_FILE=dev.env" >> $GITHUB_ENV
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test

      - name: Create env file for Docker build if missing
        run: |
          if [ ! -f "${{ env.ENV_FILE }}" ]; then
            cp .env.example ${{ env.ENV_FILE }}
          fi

      - name: Build Docker image (verify Dockerfile)
        run: docker compose --env-file ${{ env.ENV_FILE }} build app

  # Coexist: master → DEPLOY_PATH_PROD + prod.env, develop → DEPLOY_PATH_DEV + dev.env (same VPS, different dirs).
  # Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH_PROD, DEPLOY_PATH_DEV, SSH_PRIVATE_KEY; optional: DEPLOY_PORT
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'

    steps:
      - name: Set deploy target (master → prod, develop → dev)
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "ENV_FILE=prod.env" >> $GITHUB_ENV
            echo "DEPLOY_PATH=${{ secrets.DEPLOY_PATH_PROD }}" >> $GITHUB_ENV
          else
            echo "ENV_FILE=dev.env" >> $GITHUB_ENV
            echo "DEPLOY_PATH=${{ secrets.DEPLOY_PATH_DEV }}" >> $GITHUB_ENV
          fi

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            docker compose --env-file ${{ env.ENV_FILE }} up -d --build
